<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FleetCom — Bus</title>
  <link rel="stylesheet" href="bus.css" />
</head>
<body>
  <header>
    <div class="logo">FLEETCOM <span>Bus</span></div>
    <div class="clock" id="clock"></div>
    <div class="spacer"></div>
    <button class="switch" id="switch" type="button">Switch</button>
    <span class="pill mqtt connecting" id="link">MQTT…</span>
  </header>

  <div class="ident" id="ident">
    <div class="ident-route" id="ident-route">Route: —</div>
    <div class="ident-sub" id="ident-sub">Pick a route from the office roster</div>
  </div>

  <div class="banner" id="banner"></div>
  <div class="slot idle" id="slot">
    <div class="slot-k" id="slot-k">Ready</div>
    <div class="slot-s" id="slot-s">No outgoing report yet</div>
  </div>

  <div class="grid-wrap">
    <div class="cats" id="cats"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-h">
        <button class="back" id="back">←</button>
        <h3 id="sheet-title"></h3>
      </div>
      <div class="types" id="types"></div>
    </div>
  </div>
  <div class="foot">FleetCom · pick route from office roster · no typing while moving</div>

  <div class="setup" id="setup">
    <header>
      <div class="logo">FLEETCOM <span>Bus</span></div>
      <div class="clock" id="setup-clock"></div>
      <div class="spacer"></div>
      <button class="switch" id="setup-done" type="button">Done</button>
    </header>
    <div class="setup-lead">
      <h1>Choose route</h1>
      <p id="setup-sub">Office roster</p>
    </div>
    <div class="setup-list" id="setup-list"></div>
    <form class="mqtt-form" id="mqtt-form">
      <div class="hint" id="mqtt-hint">Broker: framland.duckdns.org — Automaton needs a user and password</div>
      <label for="m-user">MQTT user</label>
      <input type="text" id="m-user" autocomplete="username" autocapitalize="off" />
      <label for="m-pass">MQTT password</label>
      <input type="password" id="m-pass" autocomplete="current-password" />
      <button type="submit">Connect MQTT</button>
    </form>
  </div>

  <script src="mqtt.min.js"></script>
  <script>if (!window.mqtt) document.write('<script src="https://unpkg.com/mqtt@4.3.8/dist/mqtt.min.js"><\/script>')</script>
  <script src="mqtt-config.js"></script>
  <script src="fleet-mqtt.js"></script>
  <script src="fleet-notify.js"></script>
  <script src="fleet-store.js"></script>
  <script src="bus.js"></script>
</body>
</html>
