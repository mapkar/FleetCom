<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FLEETCOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c1016;
      --bg-2: #141a22;
      --bg-3: #1b2330;
      --line: #2a3444;
      --text: #e8edf4;
      --muted: #8b97a8;
      --amber: #f0b429;
      --amber-dim: #8a6914;
      --green: #3dd68c;
      --red: #f07178;
      --orange: #f6a15c;
      --blue: #6cb6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Share Tech Mono", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--amber);
      overflow: auto;
      user-select: none;
    }
    .crt {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 24px;
      background:
        radial-gradient(1200px 600px at 50% -10%, #1a2214 0%, transparent 55%),
        var(--bg);
    }
    .crt::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.14) 0px,
        rgba(0, 0, 0, 0.14) 1px,
        transparent 1px,
        transparent 3px
      );
      z-index: 8;
    }
    .crt::after {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, #0008 100%);
      z-index: 9;
    }
    .brand {
      text-align: center;
      margin-top: 4vh;
      margin-bottom: 18px;
      z-index: 1;
    }
    .brand h1 {
      font-size: clamp(42px, 12vw, 96px);
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--amber);
      text-shadow: 0 0 18px #f0b42955, 0 0 2px #f0b429;
      line-height: 1;
    }
    .brand .sub {
      margin-top: 10px;
      color: var(--amber-dim);
      letter-spacing: 0.28em;
      font-size: 11px;
      text-transform: uppercase;
    }
    .post {
      width: min(720px, 100%);
      flex: 1;
      min-height: 0;
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: 0.02em;
      z-index: 1;
    }
    .line {
      display: grid;
      grid-template-columns: max-content minmax(16px, 1fr) max-content;
      align-items: baseline;
      column-gap: 10px;
      opacity: 0;
    }
    .line.on { opacity: 1; }
    .line .label {
      color: var(--amber);
      white-space: nowrap;
    }
    .line .dots {
      border-bottom: 1px dotted var(--amber-dim);
      min-width: 16px;
      height: 0.85em;
    }
    .line .val {
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      letter-spacing: 0.08em;
    }
    .line .detail {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 0 0 6px 1.15em;
      overflow-wrap: anywhere;
    }
    .ok { color: var(--green) !important; }
    .fail { color: var(--red) !important; }
    .warn { color: var(--orange) !important; }
    .hdr { color: var(--muted); margin: 10px 0 6px; opacity: 0; }
    .hdr.on { opacity: 1; }
    .cursor {
      display: inline-block;
      width: 9px;
      height: 14px;
      background: var(--amber);
      margin-left: 4px;
      vertical-align: -2px;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .menu {
      width: min(720px, 100%);
      display: none;
      gap: 12px;
      margin-top: 22px;
      z-index: 1;
    }
    .menu.on { display: grid; grid-template-columns: 1fr 1fr; }
    .choice {
      display: block;
      text-decoration: none;
      border: 1px solid var(--amber-dim);
      background: #16140c;
      color: var(--amber);
      padding: 18px 16px;
      text-align: left;
      cursor: pointer;
    }
    .choice:hover, .choice:focus {
      outline: none;
      background: #2a220e;
      border-color: var(--amber);
      box-shadow: 0 0 0 1px var(--amber);
    }
    .choice kbd {
      display: inline-block;
      border: 1px solid var(--amber-dim);
      padding: 0 6px;
      margin-right: 8px;
      font: inherit;
      color: var(--amber);
    }
    .choice .name {
      font-size: 18px;
      letter-spacing: 0.14em;
    }
    .choice .hint {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    .foot {
      margin-top: 18px;
      color: var(--amber-dim);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-align: center;
      min-height: 18px;
      z-index: 1;
    }
    @media (max-width: 560px) {
      .menu.on { grid-template-columns: 1fr; }
      .post { font-size: 13px; }
      .crt { padding: 18px 14px 16px; }
    }
  </style>
</head>
<body>
  <div class="crt">
    <div class="brand">
      <h1>FLEETCOM</h1>
      <div class="sub">OCMN · ACARS boot</div>
    </div>
    <div class="post" id="post"></div>
    <div class="menu" id="menu">
      <a class="choice" href="bus.html" id="go-bus">
        <span class="name"><kbd>1</kbd> BUS MODE</span>
        <span class="hint">Driver kiosk · route select · glanceable</span>
      </a>
      <a class="choice" href="office.html" id="go-office">
        <span class="name"><kbd>2</kbd> OFFICE MODE</span>
        <span class="hint">Dispatcher dashboard · roster · feed</span>
      </a>
    </div>
    <div class="foot" id="foot"></div>
  </div>

  <script src="mqtt-config.js"></script>
  <script>
    (function () {
      const post = document.getElementById("post");
      const menu = document.getElementById("menu");
      const foot = document.getElementById("foot");
      const defaults = Object.assign({
        host: "framland.duckdns.org",
        wsPort: 9001,
        wssPort: 443,
        wsPath: "/mqtt"
      }, window.FLEET_MQTT_DEFAULTS || {});

      function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

      function addLine(html, cls) {
        const el = document.createElement("div");
        el.className = cls || "line";
        el.innerHTML = html;
        post.appendChild(el);
        requestAnimationFrame(() => el.classList.add("on"));
        return el;
      }

      function statusClass(kind) {
        if (kind === "ok") return "ok";
        if (kind === "fail") return "fail";
        return "warn";
      }

      function checkHtml(label, kind, status, detail) {
        return (
          '<span class="label">' + label + "</span>" +
          '<span class="dots"></span>' +
          '<span class="val' + (kind ? " " + statusClass(kind) : "") + '">' + status + "</span>" +
          (detail ? '<span class="detail">' + detail + "</span>" : "")
        );
      }

      function setCheck(el, label, kind, status, detail) {
        el.innerHTML = checkHtml(label, kind, status, detail);
      }

      function parseBrowser() {
        const ua = navigator.userAgent || "";
        const tests = [
          [/Edg\/([\d.]+)/, "Edge"],
          [/OPR\/([\d.]+)/, "Opera"],
          [/Chrome\/([\d.]+)/, "Chrome"],
          [/Firefox\/([\d.]+)/, "Firefox"],
          [/Version\/([\d.]+).*Safari/, "Safari"],
          [/Safari\/([\d.]+)/, "Safari"]
        ];
        let name = "Unknown";
        let ver = "";
        for (let i = 0; i < tests.length; i++) {
          const m = ua.match(tests[i][0]);
          if (m) { name = tests[i][1]; ver = m[1]; break; }
        }
        let os = "Unknown OS";
        if (/Android/i.test(ua)) os = "Android";
        else if (/iPhone|iPad|iPod/i.test(ua)) os = "iOS";
        else if (/Win/i.test(ua)) os = "Windows";
        else if (/Mac/i.test(ua)) os = "macOS";
        else if (/Linux/i.test(ua)) os = "Linux";
        return { name, ver, os, ua };
      }

      function fmtNow() {
        const d = new Date();
        const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
        const pad = (n) => String(n).padStart(2, "0");
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
        return {
          date: days[d.getDay()] + " " + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + "/" + d.getFullYear(),
          time: pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()),
          tz: tz
        };
      }

      function storedMqtt() {
        try {
          const raw = localStorage.getItem("fleetcom.mqtt");
          if (raw) return Object.assign({}, defaults, JSON.parse(raw));
        } catch (_) {}
        return defaults;
      }

      function wsCandidate(cfg) {
        const https = location.protocol === "https:";
        const path = cfg.wsPath && cfg.wsPath.charAt(0) === "/" ? cfg.wsPath : "/" + (cfg.wsPath || "mqtt");
        if (https || cfg.useTLS) {
          const port = Number(cfg.wssPort) || 443;
          const hide = port === 443;
          return { url: "wss://" + cfg.host + (hide ? "" : ":" + port) + path, label: "WSS " + cfg.host };
        }
        const port = Number(cfg.wsPort) || 9001;
        return { url: "ws://" + cfg.host + ":" + port + path, label: "WS " + cfg.host + ":" + port };
      }

      function probeWebSocket(url, ms) {
        return new Promise((resolve) => {
          let done = false;
          let ws;
          const finish = (ok, detail) => {
            if (done) return;
            done = true;
            try { ws.close(); } catch (_) {}
            resolve({ ok: ok, detail: detail });
          };
          try {
            ws = new WebSocket(url, "mqtt");
          } catch (e) {
            finish(false, e.message || "ws blocked");
            return;
          }
          const t = setTimeout(() => finish(false, "timeout"), ms);
          ws.onopen = () => { clearTimeout(t); finish(true, "handshake"); };
          ws.onerror = () => { clearTimeout(t); finish(false, "no listener"); };
          ws.onclose = () => { clearTimeout(t); if (!done) finish(false, "closed"); };
        });
      }

      async function probeBridge() {
        try {
          const res = await fetch("/api/mqtt/status", { cache: "no-store" });
          if (!res.ok) return null;
          return await res.json();
        } catch (_) {
          return null;
        }
      }

      async function probeNetwork() {
        const online = navigator.onLine !== false;
        if (!online) return { ok: false, detail: "navigator offline" };
        const host = storedMqtt().host || defaults.host;
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 3500);
          await fetch("https://" + host + "/", { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
          clearTimeout(t);
          return { ok: true, detail: host };
        } catch (e) {
          if (online) return { ok: true, detail: "local link only" };
          return { ok: false, detail: e.name === "AbortError" ? "timeout" : "unreachable" };
        }
      }

      async function run() {
        const br = parseBrowser();
        const now = fmtNow();
        const cfg = storedMqtt();

        addLine("FLEETCOM BIOS  4.02   " + now.date, "hdr");
        await sleep(180);
        addLine("Copyright (C) OCMN Transportation  ACARS module", "hdr");
        await sleep(220);

        addLine(checkHtml("CPU", "", br.name + " " + (br.ver || ""), br.os));
        await sleep(260);

        const wsOk = typeof WebSocket !== "undefined";
        const lsOk = (function () {
          try { localStorage.setItem("_fc_post", "1"); localStorage.removeItem("_fc_post"); return true; }
          catch (_) { return false; }
        })();
        const brKind = wsOk && lsOk ? "ok" : "fail";
        addLine(checkHtml(
          "BROWSER",
          brKind,
          wsOk && lsOk ? "OK" : "FAIL",
          "WS=" + (wsOk ? "YES" : "NO") + "   STORE=" + (lsOk ? "YES" : "NO")
        ));
        await sleep(320);

        const netLine = addLine(checkHtml("NETWORK", "", "CHECKING"));
        const net = await probeNetwork();
        setCheck(netLine, "NETWORK", net.ok ? "ok" : "fail", net.ok ? "OK" : "FAIL", net.detail.toUpperCase());
        await sleep(280);

        const mqttLine = addLine(checkHtml("MQTT BROKER", "", "PROBING"));
        const bridge = await probeBridge();
        let mqttOk = false;
        let mqttDetail = "";
        if (bridge && bridge.connected) {
          mqttOk = true;
          mqttDetail = "BRIDGE  " + (bridge.host || cfg.host) + ":" + (bridge.port || 1883);
        } else {
          const cand = wsCandidate(cfg);
          const probe = await probeWebSocket(cand.url, 4500);
          mqttOk = probe.ok;
          mqttDetail = cand.label.toUpperCase() + " \u2014 " + (probe.ok ? "LISTENER UP" : probe.detail.toUpperCase());
          if (!probe.ok && bridge && bridge.error) {
            mqttDetail = "BRIDGE  " + String(bridge.error).toUpperCase();
          }
        }
        setCheck(mqttLine, "MQTT BROKER", mqttOk ? "ok" : "warn", mqttOk ? "OK" : "WARN", mqttDetail);
        await sleep(280);

        const rtc = fmtNow();
        addLine(checkHtml("RTC", "ok", rtc.time, rtc.date + (rtc.tz ? "   " + rtc.tz : "")));
        await sleep(240);

        addLine(checkHtml("BOOT DEVICE", "", "ACARS", "INDEX.HTML"));
        await sleep(200);
        addLine(checkHtml("SYSTEM", "ok", "READY"));
        await sleep(180);

        const cur = document.createElement("div");
        cur.className = "line on";
        cur.innerHTML = '<span class="label">SELECT BOOT MODE<span class="cursor"></span></span>';
        post.appendChild(cur);

        menu.classList.add("on");
        foot.textContent = "1 BUS   \u00b7   2 OFFICE   \u00b7   ENTER FOLLOWS HIGHLIGHT";
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "1" || e.key === "b" || e.key === "B") {
          location.href = "bus.html";
        } else if (e.key === "2" || e.key === "o" || e.key === "O") {
          location.href = "office.html";
        }
      });

      run();
    })();
  </script>
</body>
</html>
